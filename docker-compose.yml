# Local development stack. Ports are bound to 127.0.0.1 only.
# Usage: cp .env.example .env && docker compose up --build

name: decisionguard

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decisionguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionguard}
      POSTGRES_DB: ${POSTGRES_DB:-decisionguard}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment: &api-env
      DG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-decisionguard}:${POSTGRES_PASSWORD:-decisionguard}@postgres:5432/${POSTGRES_DB:-decisionguard}
      DG_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./apps/api
    env_file: [.env]
    environment: *api-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
