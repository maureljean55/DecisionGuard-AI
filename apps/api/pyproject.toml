[project]
name = "decisionguard-api"
version = "0.1.0"
description = "DecisionGuard AI — backend API, risk engine and agent orchestration"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires running Postgres/Redis (docker compose up)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]  # asserts, synthetic secrets, long URLs
